<style>
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:Poppins,sans-serif;color:#232946;background:#f7f5ee;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(60% 35% at 0% 100%,rgba(63,174,73,.16),transparent 70%),radial-gradient(50% 30% at 100% 0%,rgba(63,174,73,.12),transparent 70%),#f7f5ee}

.pad{position:absolute;left:80px;right:80px}
h1{font-size:96px;line-height:1.06;font-weight:800;letter-spacing:-.025em}
.hl{background:#3fae49;color:#fff;padding:0 18px;border-radius:18px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.red{background:#e5484d}
.tag{display:inline-block;font-size:38px;font-weight:700;padding:8px 26px;border-radius:999px;color:#fff}
.stage{position:absolute;left:80px;right:80px;top:560px;height:820px;border-radius:60px;overflow:hidden}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:170px;background:rgba(0,0,0,.05)}
.who{position:absolute;bottom:40px}
.chips{position:absolute;left:80px;right:80px;top:1420px;display:flex;flex-wrap:wrap;gap:16px}
.chips span{background:#fff;border-radius:20px;padding:14px 26px;font-size:40px;font-weight:700;box-shadow:0 16px 30px -22px rgba(35,41,70,.5)}
.tipc{position:absolute;left:80px;right:80px;top:1560px;background:#10261a;color:#fff;border-radius:28px;padding:24px 32px;font-size:40px;font-weight:600}
.tipc b{color:#7fe09a}
.bubble{position:absolute;background:#fff;border-radius:30px;padding:22px 28px;font-size:40px;font-weight:700;box-shadow:0 24px 40px -26px rgba(35,41,70,.6);max-width:430px}
.ck{display:flex;align-items:center;gap:24px;font-size:52px;font-weight:700;background:#fff;border-radius:28px;padding:22px 30px;box-shadow:0 20px 40px -28px rgba(35,41,70,.45);margin-top:22px}
.ck i{flex:none;width:60px;height:60px;border-radius:50%;background:#3fae49;position:relative}.ck i::after{content:"";position:absolute;left:20px;top:10px;width:16px;height:30px;border:solid #fff;border-width:0 8px 8px 0;transform:rotate(45deg)}
.logo{display:flex;align-items:center;gap:6px;font-size:88px;font-weight:600;letter-spacing:.1em;color:#1e2a4a}
.cta{display:inline-flex;align-items:center;gap:14px;font-size:42px;font-weight:700;white-space:nowrap;background:#10261a;color:#fff;border-radius:999px;padding:20px 36px}
.cta b{background:#3fae49;padding:4px 22px;border-radius:16px}

/* house style v2: newsprint paper, grain, sticker characters, taped cards, no gradient blobs or dot grids */
body{background:#f3eee2 !important}
.bg{background:#f3eee2 !important}
.dots{display:none !important}
.grain{position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='300'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .2 0 0 0 .55 0'/%3E%3C/filter%3E%3Crect width='300' height='300' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.32;mix-blend-mode:multiply;pointer-events:none;z-index:50}

.hand{font-family:Kalam,cursive;font-weight:700;color:#d3212c}
h1{line-height:1.18 !important}
.stage{border-radius:10px !important;transform:rotate(-1deg);box-shadow:0 22px 30px -24px rgba(35,41,70,.55)}
.stage::before{content:"";position:absolute;top:-14px;left:50%;width:180px;height:40px;transform:translateX(-50%) rotate(-3deg);background:rgba(233,220,180,.9);z-index:3}
.stage{overflow:visible !important}.stage .floor{border-radius:0 0 10px 10px}
.chips{top:1410px !important;gap:12px !important}.chips span{font-size:34px !important;padding:10px 20px !important;border-radius:6px !important}
.tipc{top:1640px !important;border-radius:8px !important;transform:rotate(-.6deg)}
.bubble{font-family:Kalam,cursive;font-size:44px !important;border-radius:12px !important;transform:rotate(-2deg)}
.tag{border-radius:6px !important}
.cta{border-radius:10px !important}
</style></head><body>

<script>const RAJA="\n    <ellipse cx=\"300\" cy=\"760\" rx=\"190\" ry=\"26\" fill=\"url(#shadow)\"/>\n    <!-- legs: rolled newspaper -->\n    <g><rect x=\"215\" y=\"640\" width=\"52\" height=\"105\" rx=\"24\" fill=\"url(#paperG)\" stroke=\"#c9bfa5\" stroke-width=\"3\"/><rect x=\"333\" y=\"640\" width=\"52\" height=\"105\" rx=\"24\" fill=\"url(#paperG)\" stroke=\"#c9bfa5\" stroke-width=\"3\"/>\n      <path d=\"M196 742q45-26 82 0v12h-82z\" fill=\"#7a4a22\"/><path d=\"M322 742q45-26 82 0v12h-82z\" fill=\"#7a4a22\"/>\n      <path d=\"M200 750h76\" stroke=\"#5a3415\" stroke-width=\"5\"/><path d=\"M326 750h76\" stroke=\"#5a3415\" stroke-width=\"5\"/></g>\n    <!-- body: stacked newspapers, each sheet slightly offset -->\n    <g>\n      <path d=\"M140 300 Q300 270 460 300 L470 640 Q300 680 130 640 Z\" fill=\"url(#paperG)\" stroke=\"#c4b99c\" stroke-width=\"4\"/>\n      <g stroke=\"#cfc4a6\" stroke-width=\"3\" fill=\"none\" opacity=\".9\">\n        <path d=\"M136 360q164 -22 330 0\"/><path d=\"M134 420q166 -20 334 0\"/><path d=\"M132 480q168 -20 336 0\"/><path d=\"M131 540q169 -20 338 0\"/><path d=\"M130 600q170 -20 340 0\"/></g>\n      <!-- printed columns on the front sheet -->\n      <g fill=\"#b9b3a3\" opacity=\".75\"><rect x=\"170\" y=\"380\" width=\"70\" height=\"7\" rx=\"3\"/><rect x=\"170\" y=\"396\" width=\"58\" height=\"7\" rx=\"3\"/><rect x=\"370\" y=\"380\" width=\"62\" height=\"7\" rx=\"3\"/><rect x=\"370\" y=\"396\" width=\"70\" height=\"7\" rx=\"3\"/><rect x=\"172\" y=\"560\" width=\"64\" height=\"7\" rx=\"3\"/><rect x=\"172\" y=\"576\" width=\"50\" height=\"7\" rx=\"3\"/><rect x=\"372\" y=\"560\" width=\"66\" height=\"7\" rx=\"3\"/><rect x=\"372\" y=\"576\" width=\"54\" height=\"7\" rx=\"3\"/></g>\n      <text x=\"338\" y=\"352\" text-anchor=\"middle\" font-family=\"Georgia,serif\" font-weight=\"700\" font-size=\"21\" fill=\"#5c5546\" letter-spacing=\"2\">{{HEAD}}</text>\n      <!-- side highlight for volume -->\n      <path d=\"M150 310 Q160 470 146 630\ Z\" fill=\"url(#paperTop)\" stroke=\"#c4b99c\" stroke-width=\"4\"/>\n    <path d=\"M168 270 Q300 290 432 270\" stroke=\"#e3dac3\" stroke-width=\"4\" fill=\"none\"/>\n    <!-- crown: folded newspaper with gold trim -->\n    <g><path d=\"M190 168 L210 92 L250 140 L300 70 L350 140 L390 92 L410 168 Q300 150 190 168 Z\" fill=\"url(#paperTop)\" stroke=\"#c4b99c\" stroke-width=\"4\"/>\n      <path d=\"M188 168 Q300 146 412 168 L410 186 Q300 166 190 186 Z\" fill=\"url(#gold)\" stroke=\"#b7811c\" stroke-width=\"2\"/>\n      <circle cx=\"300\" cy=\"72\" r=\"10\" fill=\"url(#gold)\"/><circle cx=\"210\" cy=\"92\" r=\"8\" fill=\"url(#gold)\"/><circle cx=\"390\" cy=\"92\" r=\"8\" fill=\"url(#gold)\"/>\n      <g fill=\"#b9b3a3\" opacity=\".7\"><rect x=\"270\" y=\"118\" width=\"60\" height=\"5\" rx=\"2\"/><rect x=\"278\" y=\"128\" width=\"44\" height=\"5\" rx=\"2\"/></g>\n      <circle cx=\"300\" cy=\"176\" r=\"9\" fill=\"#2f9a3c\" stroke=\"#fff\" stroke-width=\"2\"/></g>\n    <!-- face -->\n    <g class=\"face\">\n      <ellipse cx=\"236\" cy=\"236\" rx=\"24\" ry=\"14\" fill=\"url(#blush)\"/><ellipse cx=\"364\" cy=\"236\" rx=\"24\" ry=\"14\" fill=\"url(#blush)\"/>\n      <g class=\"eyes\">\n        <g class=\"eyeL\"><ellipse cx=\"252\" cy=\"214\" rx=\"30\" ry=\"34\" fill=\"url(#eyeW)\" stroke=\"#232946\" stroke-width=\"3\"/><circle class=\"pupil\" cx=\"258\" cy=\"218\" r=\"19\" fill=\"url(#iris)\"/><circle cx=\"258\" cy=\"218\" r=\"9\" fill=\"#14090a\"/><circle cx=\"266\" cy=\"208\" r=\"6\" fill=\"#fff\"/><circle cx=\"252\" cy=\"226\" r=\"2.5\" fill=\"#fff\" opacity=\".8\"/></g>\n        <g class=\"eyeR\"><ellipse cx=\"348\" cy=\"214\" rx=\"30\" ry=\"34\" fill=\"url(#eyeW)\" stroke=\"#232946\" stroke-width=\"3\"/><circle class=\"pupil\" cx=\"342\" cy=\"218\" r=\"19\" fill=\"url(#iris)\"/><circle cx=\"342\" cy=\"218\" r=\"9\" fill=\"#14090a\"/><circle cx=\"350\" cy=\"208\" r=\"6\" fill=\"#fff\"/><circle cx=\"336\" cy=\"226\" r=\"2.5\" fill=\"#fff\" opacity=\".8\"/></g>\n      </g>\n      <g class=\"brows\"><path class=\"bL\" d=\"M220 172 Q250 158 278 172\" stroke=\"#232946\" stroke-width=\"9\" fill=\"none\" stroke-linecap=\"round\"/><path class=\"bR\" d=\"M322 172 Q350 158 380 172\" stroke=\"#232946\" stroke-width=\"9\" fill=\"none\" stroke-linecap=\"round\"/></g>\n      <!-- Kanpuriya moustache -->\n      <path d=\"M300 256 C 270 244, 236 250, 214 272 C 238 266, 262 270, 300 266 C 338 270, 362 266, 386 272 C 364 250, 330 244, 300 256 Z\" fill=\"#232946\"/>\n      <path d=\"M214 272 q-14 -2 -18 -16\" stroke=\"#232946\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M386 272 q14 -2 18 -16\" stroke=\"#232946\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\"/>\n      <path class=\"mouth\" d=\"M272 282 Q300 304 328 282\" stroke=\"#5a1f1f\" stroke-width=\"7\" fill=\"#b8423b\" stroke-linecap=\"round\"/>\n    </g>\n  ";</script><script src="gang.js"></script>
<script>
const S=(inner,w,h)=>`<svg viewBox="0 0 600 800" width="${w}" height="${h}">${inner}</svg>`;
const sack=(col,dark,label)=>`<svg viewBox="0 0 320 380" width="360" height="428"><path d="M40 90 Q30 250 50 340 Q160 372 270 340 Q292 250 280 90 Z" fill="${col}" stroke="${dark}" stroke-width="5"/>
 ${[120,170,220,270,320].map(y=>`<path d="M44 ${y} Q160 ${y+14} 278 ${y}" stroke="${dark}" stroke-width="2" opacity=".35" fill="none"/>`).join("")}
 ${[80,120,160,200,240].map(x=>`<path d="M${x} 96 Q${x+4} 220 ${x-2} 350" stroke="${dark}" stroke-width="2" opacity=".25" fill="none"/>`).join("")}
 <path d="M40 90 Q160 60 280 90 Q160 120 40 90 Z" fill="${dark}"/>
 <path d="M70 92 Q160 40 250 92" stroke="#c9a26b" stroke-width="12" fill="none" stroke-linecap="round"/>
 <rect x="96" y="190" width="128" height="76" rx="14" fill="#fff"/><text x="160" y="240" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="30" fill="${dark}">${label}</text></svg>`;
const B=60/130,T0=8*B,SC=10*B,T4=T0+3*SC,T5=T4+10*B,END=T5+10*B;window.DURATION=END;
const SCENES=[
 {n:"Thaila 1",title:"Paper",col:"#c98b4f",soft:"#fff3e6",dark:"#8a5d2a",chars:[RAJA.replace("{{HEAD}}","KANPUR KI KHABAR")],line:"Guru, sukha rakhna, geela paper kam bikta hai!",items:["Akhbaar","Copy, kitaab","Gatte ke dibbe"],tip:"Bundle bana ke <b>sutli se baandh do</b>."},
 {n:"Thaila 2",title:"Plastic",col:"#4aa3d6",soft:"#eef3ff",dark:"#1d5f8a",chars:[GANG.botal("wink")],line:"Dho do, sukha do, thaile mein daal do. Simple.",items:["Bottles","Dabbe","Polythene"],tip:"Khana laga plastic <b>dho ke hi rakhna</b>."},
 {n:"Thaila 3",title:"Metal + E-waste",col:"#7d8794",soft:"#eef1ea",dark:"#4a525c",chars:[GANG.tinku("happy"),GANG.mobile("happy")],line:"Battery alag rakhna beta!",items:["Tin, bartan","Taar","Purana phone, charger"],tip:"Phone ki <b>battery hamesha alag</b>."}];

  <div class="who" id="bag${i}" style="right:${s.chars.length>1?20:50}px;bottom:60px">${s.chars.length>1?sack(s.col,s.dark,s.title.split(" ")[0]).replace('width="360" height="428"','width="300" height="356"'):sack(s.col,s.dark,s.title.split(" ")[0])}</div>
  <div class="bubble" id="b${i}" style="right:36px;top:36px;max-width:400px">${s.line}</div></div>
 <div class="chips" id="c${i}">${s.items.map(x=>`<span>${x}</span>`).join("")}</div>
 <div class="tipc" id="t${i}">${s.tip}</div></div>`});
html+=`<div class="layer" id="pay"><div class="pad" style="top:250px"><h1 style="font-size:90px">3 thaile =<br><span class="hl">Dumpasur khatam</span></h1>

 <div style="margin-top:70px"><img src="circulyst-logo.png" alt="Circulyst" style="height:170px;display:block"></div>

document.getElementById("root").innerHTML=html;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function vis(id,t,a,b,instant){const el=document.getElementById(id);const i=instant?1:ease((t-a)/.25),o=ease((t-(b-.2))/.2);const on=t>=a&&t<b;el.style.opacity=on?(i*(1-o)).toFixed(3):0;el.style.transform=`translateY(${((1-i)*50-o*30).toFixed(1)}px)`}
const pop=(id,t,a,from=40)=>{const el=document.getElementById(id);const p=back((t-a)/.45);el.style.opacity=clamp((t-a)/.15);el.style.transform=(el.style.transform.includes("translateX")?"translateX(-50%) ":"")+`translateY(${((1-p)*from).toFixed(1)}px) scale(${(.85+.15*p).toFixed(3)})`};
window.render=function(t){
  vis("hook",t,0,T0,true);
  const g=ease(t/T0);document.getElementById("dumpW").style.transform=`translateX(-50%) scale(${(.8+.35*g).toFixed(3)})`;document.getElementById("dumpW").style.transformOrigin="50% 100%";
  const hb=document.getElementById("hookB");hb.style.opacity=clamp((t-.9)/.2);hb.style.transform=`scale(${(.8+.2*back((t-.9)/.4)).toFixed(3)})`;
  SCENES.forEach((s,i)=>{const a=T0+i*SC;vis("sc"+i,t,a,a+SC);
    const w=document.getElementById("w"+i);const pw=back((t-a-.2)/.5);w.style.transform=`translateY(${((1-pw)*120).toFixed(1)}px)`;w.style.opacity=clamp((t-a-.2)/.15);
    const bg=document.getElementById("bag"+i);const pb=back((t-a-.45)/.5);bg.style.transform=`translateY(${((1-pb)*80).toFixed(1)}px) rotate(${((1-pb)*6).toFixed(1)}deg)`;bg.style.opacity=clamp((t-a-.45)/.15);
    const bb=document.getElementById("b"+i);const pq=back((t-a-.8)/.4);bb.style.opacity=clamp((t-a-.8)/.15);bb.style.transform=`scale(${(.8+.2*pq).toFixed(3)})`;bb.style.transformOrigin="0 100%";
    [...document.getElementById("c"+i).children].forEach((c,j)=>{const p=back((t-a-.85-j*.45)/.35);c.style.opacity=clamp((t-a-.85-j*.45)/.12);c.style.transform=`translateY(${((1-p)*30).toFixed(1)}px)`;c.style.display="inline-block"});
    const tp=document.getElementById("t"+i);tp.style.opacity=clamp((t-a-1.4)/.25);});
  vis("pay",t,T4,T5);
  [...document.querySelectorAll("#pay .ck")].forEach((c,j)=>{const p=ease((t-T4-.4-j*.35)/.3);c.style.opacity=p;c.style.transform=`translateX(${((1-p)*-60).toFixed(1)}px)`});
  const sh=clamp((t-T4-.6)/1.6);const ds=document.getElementById("dumpS");ds.style.transformOrigin="50% 100%";ds.style.transform=`translateX(-50%) translateX(260px) scale(${(1-0.75*ease(sh)).toFixed(3)})`;ds.style.opacity=(1-sh*0.9).toFixed(3);
  vis("end",t,T5,END+1);const cp=back((t-T5-.6)/.4);const ct=document.getElementById("cta");ct.style.opacity=clamp((t-T5-.6)/.15);ct.style.transform=`scale(${(.85+.15*cp).toFixed(3)})`;
};
