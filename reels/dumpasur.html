 ${[120,170,220,270,320].map(y=>`<path d="M44 ${y} Q160 ${y+14} 278 ${y}" stroke="${dark}" stroke-width="2" opacity=".35" fill="none"/>`).join("")}

  const shrink=clamp((t-T[2]-.6)/3.4);const dB=document.getElementById("dumpB");dB.style.transform=`scale(${(1-.55*ease(shrink)).toFixed(3)}) rotate(${(Math.sin(t*5)*3*(1-shrink)).toFixed(2)}deg)`;
