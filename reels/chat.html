<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Kalam:wght@700&display=swap">
<style>
/* R5: society group-chat format. Messages pop in one by one; Raddi Raja replies. Generic chat look, no app branding. */
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:Poppins,sans-serif;background:#f3eee2;color:#232946;position:relative}
.grain{position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='300'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .2 0 0 0 .55 0'/%3E%3C/filter%3E%3Crect width='300' height='300' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.3;mix-blend-mode:multiply;pointer-events:none;z-index:50}
.phone{position:absolute;left:70px;right:70px;top:140px;bottom:500px;background:#e9e4d6;border-radius:56px;border:14px solid #1c2230;overflow:hidden;box-shadow:0 40px 80px -40px rgba(0,0,0,.5);transform:rotate(-1deg)}
.head{background:#10261a;color:#fff;padding:34px 36px;display:flex;align-items:center;gap:22px}
.av{width:84px;height:84px;border-radius:50%;background:#2f9a3c;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:38px}
.head b{display:block;font-size:40px}.head span{font-size:28px;opacity:.75}
.feed{position:absolute;left:0;right:0;top:152px;bottom:0;overflow:hidden;padding:30px 28px;display:flex;flex-direction:column;gap:22px;justify-content:flex-end}
.m{max-width:84%;background:#fff;border-radius:8px 30px 30px 30px;padding:18px 26px 14px;font-size:38px;line-height:1.3;box-shadow:0 6px 10px -8px rgba(0,0,0,.4);opacity:0;transform-origin:0 0}
.m .n{display:block;font-size:28px;font-weight:700;margin-bottom:4px}
.m.raja{align-self:flex-end;background:#d9f2d0;border-radius:30px 8px 30px 30px;transform-origin:100% 0}
.typing{align-self:flex-end;background:#d9f2d0;border-radius:30px;padding:20px 30px;opacity:0;display:flex;gap:10px}
.typing i{width:16px;height:16px;border-radius:50%;background:#2f9a3c;display:block}
.raja-img{position:absolute;right:60px;bottom:30px;height:470px;z-index:20;opacity:0;filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(10px 18px 12px rgba(35,41,70,.25));transform-origin:50% 100%}
.top{position:absolute;left:80px;right:80px;top:40px;font-family:Kalam,cursive;color:#d3212c;font-size:50px;transform:rotate(-2deg);z-index:30;white-space:nowrap}
.end{position:absolute;inset:0;background:#f3eee2;opacity:0;z-index:40;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 90px;gap:30px}
.end h1{font-size:96px;line-height:1.18;font-weight:800;letter-spacing:-.025em}
.hl{background:#2f9a3c;color:#fff;padding:0 16px;border-radius:10px 18px 12px 20px/20px 10px 18px 12px}
.cta{display:inline-flex;gap:14px;align-items:center;font-size:46px;font-weight:700;background:#10261a;color:#fff;border-radius:10px;padding:22px 34px;transform:rotate(-.8deg)}
.cta b{background:#3fae49;padding:4px 20px;border-radius:8px}
</style></head><body>
<div class="top">har mahine, har society ka group:</div>
<div class="phone"><div class="head"><div class="av">S</div><div><b>Shanti Apartments, Block C</b><span>Gupta aunty, Verma ji, Pinky, +38</span></div></div>
<div class="feed" id="feed"></div></div>
<img class="raja-img" id="rj" src="chars3d/raja.png">
<div class="end" id="end"><h1>Ye group chat<br><span class="hl">badalne wala hai.</span></h1><img src="circulyst-logo.png" style="height:120px"><div style="font-size:44px;font-weight:700;color:#2f9a3c">Value Begins Here.</div><div class="cta">Comment <b>KANPUR</b> · early access</div></div>
<div class="grain"></div>
<script>
const M=[
 {n:"Gupta aunty",c:"#c0392b",t:"Kabadiwale bhaiya phir 'kal pakka' bol ke gayab",at:.6},
 {n:"Verma ji",c:"#2471a3",t:"Mere yahan kaante pe 3 kilo kam tola, pakka",at:3.0},
 {n:"Pinky",c:"#8e44ad",t:"Rate bhi tolne ke BAAD bataya",at:5.4},
 {raja:true,n:"Raddi Raja",t:"Guru, isiliye toh hum aa rahe hain. Rate pehle, digital kaanta, har pickup ki receipt.",at:8.6},
 {n:"Gupta aunty",c:"#c0392b",t:"Kab se??",at:12.0},
 {raja:true,n:"Raddi Raja",t:"Jald. Comment KANPUR karo, sabse pehle aapko batayenge.",at:14.0}];
const END=17.6,DUR=21.4;window.DURATION=DUR;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),back=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const feed=document.getElementById("feed");
M.forEach((m,i)=>{if(m.raja){const ty=document.createElement("div");ty.className="typing";ty.id="ty"+i;ty.innerHTML="<i></i><i></i><i></i>";feed.appendChild(ty)}
 const d=document.createElement("div");d.className="m"+(m.raja?" raja":"");d.id="m"+i;d.innerHTML=`<span class="n" style="color:${m.raja?"#13711f":m.c}">${m.n}</span>${m.t}`;feed.appendChild(d)});
window.render=function(t){
 M.forEach((m,i)=>{const d=document.getElementById("m"+i),ty=document.getElementById("ty"+i);
  if(ty){const on=t>=m.at-1.2&&t<m.at;ty.style.display=t>=m.at?"none":"flex";ty.style.opacity=on?1:0;ty.querySelectorAll("i").forEach((e,k)=>e.style.transform=`translateY(${(Math.sin(t*9-k)*-6).toFixed(1)}px)`)}
  const p=back((t-m.at)/.35);d.style.display=t>=m.at?"block":"none";d.style.opacity=clamp((t-m.at)/.12);d.style.transform=`scale(${(.8+.2*p).toFixed(3)})`});
 const rj=document.getElementById("rj"),ra=M[3].at-1.4,lt=t-ra,walk=lt<1.5,ph=lt*Math.PI*4.4;
 rj.style.opacity=lt>0&&t<END?1:0;rj.style.transform=`translate(${((1-clamp(lt/1.5))*600).toFixed(0)}px,${(walk?Math.abs(Math.sin(ph))*-18:Math.sin(t*2.4)*-5).toFixed(1)}px) rotate(${(walk?Math.sin(ph)*3.5:Math.sin(t*1.8)*1.2).toFixed(2)}deg)`;
 const e=document.getElementById("end");e.style.opacity=clamp((t-END)/.4);
};render(0);
</script></body></html>
